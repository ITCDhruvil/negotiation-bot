services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: negotiator
      POSTGRES_PASSWORD: negotiator
      POSTGRES_DB: negotiation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negotiator -d negotiation"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      COMPANY_NAME: ${COMPANY_NAME:-SKODA}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      DATABASE_URL: postgresql://negotiator:negotiator@postgres:5432/negotiation
      REDIS_URL: redis://redis:6379/0
      USE_IN_MEMORY: "false"
      CORS_ORIGINS: http://localhost:3000
      HANDOFF_WEBHOOK_URL: ${HANDOFF_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_INTERNAL_URL: http://backend:${BACKEND_PORT:-8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
